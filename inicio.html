<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio</title>
<style>
  :root {
    --negro: #0b0b0b;
    --negro2: #151515;
    --naranja: #ff9000;
    --naranja2: #ffb347;
    --blanco: #ffffff;
    --gris: #9a9a9a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--blanco);
    background: var(--negro);
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- FONDO ---------- */
  .fondo {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,144,0,.28), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255,144,0,.22), transparent 50%),
      radial-gradient(circle at 50% 110%, rgba(255,179,71,.18), transparent 55%),
      linear-gradient(160deg, #050505 0%, #121212 50%, #070707 100%);
  }
  .fondo::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,144,0,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,144,0,.06) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at center, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 75%);
  }
  .brillo {
    position: fixed;
    width: 420px; height: 420px;
    border-radius: 50%;
    filter: blur(110px);
    z-index: -1;
    opacity: .35;
    background: var(--naranja);
    animation: flotar 14s ease-in-out infinite alternate;
  }
  .brillo.a { top: -120px; left: -120px; }
  .brillo.b { bottom: -150px; right: -120px; animation-delay: -6s; background: var(--naranja2); }
  @keyframes flotar {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(60px,40px) scale(1.2); }
  }

  /* ---------- CABECERA ---------- */
  header {
    padding: 28px 6vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -1px;
    text-decoration: none;
    user-select: none;
  }
  .logo .txt { color: var(--blanco); }
  .logo .caja {
    background: var(--naranja);
    color: var(--negro);
    padding: 0 .35em;
    border-radius: .22em;
    transform: skewX(-6deg);
    box-shadow: 0 0 25px rgba(255,144,0,.55);
  }

  /* ---------- CONTENIDO ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 6vw 80px;
    text-align: center;
  }
  .subtitulo {
    color: var(--gris);
    font-size: 1.05rem;
    margin-bottom: 50px;
  }
  .subtitulo b { color: var(--naranja); font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
  }

  .tarjeta {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 190px;
    padding: 26px 24px;
    text-align: left;
    text-decoration: none;
    color: var(--blanco);
    background: linear-gradient(145deg, rgba(30,30,30,.85), rgba(12,12,12,.9));
    border: 1px solid rgba(255,144,0,.25);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    overflow: hidden;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .tarjeta::before {
    content: "";
    position: absolute;
    left: 0; top: 0;
    width: 5px; height: 100%;
    background: var(--naranja);
    transition: width .25s ease;
  }
  .tarjeta:hover {
    transform: translateY(-6px);
    border-color: var(--naranja);
    box-shadow: 0 12px 40px rgba(255,144,0,.28);
  }
  .tarjeta:hover::before { width: 100%; opacity: .12; }

  .num {
    font-size: .85rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--naranja);
  }
  .tarjeta h2 {
    font-size: 1.5rem;
    margin: 10px 0 6px;
    position: relative;
  }
  .tarjeta p {
    color: var(--gris);
    font-size: .92rem;
    position: relative;
  }
  .ir {
    margin-top: 18px;
    font-weight: 700;
    font-size: .9rem;
    color: var(--naranja);
    position: relative;
    transition: letter-spacing .25s ease;
  }
  .tarjeta:hover .ir { letter-spacing: 1px; color: var(--naranja2); }

  footer {
    text-align: center;
    padding: 20px;
    color: #555;
    font-size: .8rem;
  }

  @media (max-width: 500px) {
    .subtitulo { margin-bottom: 30px; }
  }

</style>
</head>
<body>

<div class="fondo"></div>
<div class="brillo a"></div>
<div class="brillo b"></div>

<header>
  <a class="logo" href="#">
    <span class="txt">Inicio</span><span class="caja">Web</span>
  </a>
</header>

<main>
  <p class="subtitulo">Elige un proyecto y entra <b>con un clic</b></p>

  <div class="grid">

    <a class="tarjeta" href="https://josemanuelgar125-ux.github.io/semafor/htmlSemantico.html" target="_blank" rel="noopener">
      <div>
        <span class="num">01</span>
        <h2>Semáforo</h2>
        <p>Página con HTML semántico.</p>
      </div>
      <span class="ir">Entrar →</span>
    </a>

    <a class="tarjeta" href="https://josemanuelgar125-ux.github.io/ordinador/index%20(2).html" target="_blank" rel="noopener">
      <div>
        <span class="num">02</span>
        <h2>Ordenador</h2>
        <p>Proyecto sobre ordenadores.</p>
      </div>
      <span class="ir">Entrar →</span>
    </a>

    <a class="tarjeta" href="https://josemanuelgar125-ux.github.io/cuina2/cocina2/index.html" target="_blank" rel="noopener">
      <div>
        <span class="num">03</span>
        <h2>Cocina</h2>
        <p>Web de cocina.</p>
      </div>
      <span class="ir">Entrar →</span>
    </a>

    <a class="tarjeta" href="https://josemanuelgar125-ux.github.io/web-prueba/index.html" target="_blank" rel="noopener">
      <div>
        <span class="num">04</span>
        <h2>Web prueba</h2>
        <p>Página de pruebas.</p>
      </div>
      <span class="ir">Entrar →</span>
    </a>

  </div>
</main>

<footer>© Mis proyectos · GitHub Pages</footer>

</body>
</html>
